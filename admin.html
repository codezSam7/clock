<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Attendance System</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <nav>
      <div class="navbar-brand">Admin Dashboard</div>
    </nav>

    <div class="container">
      <div id="login">
        <h2>Admin Login</h2>
        <p id="logp">Welcome back, login to access the dashboard</p>

        <input type="text" id="username" placeholder="Enter admin username" />
        <input type="email" id="email" placeholder="Enter admin email" />

        <button id="loginBtn" class="primary">Login</button>

        <button id="switchToStaff" class="secondary" style="margin-top: 0.8rem">
          Login as a Staff
        </button>
      </div>

      <div id="dashboard" class="hidden">
        <h2>Dashboard</h2>
        <h3>Total Staff Today: <span id="totalStaff">0</span></h3>
        <h3>Currently Working: <span id="workingNow">0</span></h3>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Department</th>
                <th>Employee ID</th>
                <th>Clock In</th>
                <th>Clock Out</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="staffTableBody">
              <!-- Rows here -->
            </tbody>
          </table>
        </div>

        <button id="logoutBtn" class="secondary">Logout</button>
      </div>
    </div>

    <footer>
      <p class="footer">&copy; 2025 Company name. All rights reserved</p>
    </footer>

    <script src="js/admin.js"></script>
  </body>
</html>
