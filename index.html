<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Attendance System</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <nav>
      <div class="navbar-brand">Login portal</div>
    </nav>

    <div class="container">
      <div id="login">
        <h2>Staff Login</h2>
        <p id="logp">Welcome back, login to access your dashboard</p>

        <input type="text" id="username" placeholder="Enter your name" />
        <input type="email" id="email" placeholder="Enter your email" />

        <button id="loginBtn" class="primary">Login</button>

        <!-- This button is now INSIDE the card -->
        <button id="switchToAdmin" class="secondary" style="margin-top: 0.8rem">
          Login as an Admin
        </button>
      </div>

      <div id="dashboard" class="hidden">
        <h2>Dashboard</h2>
        <p class="welcome-text">Welcome, <span id="userName"></span>!</p>

        <div class="profile-section">
          <div class="profile-field">
            <label>Name</label>
            <input type="text" id="profileName" />
          </div>
          <div class="profile-field">
            <label>Email</label>
            <input type="email" id="profileEmail" />
          </div>
          <div class="profile-field">
            <label>Role</label>
            <input type="text" id="profileRole" />
          </div>
          <div class="profile-field">
            <label>Department</label>
            <input type="text" id="profileDepartment" />
          </div>
          <div class="profile-field">
            <label>Employee ID</label>
            <input type="text" id="profileEmployeeId" />
          </div>
        </div>

        <!-- Buttons -->
        <div class="button-group">
          <button id="clockInBtn" class="primary">Clock In</button>
          <button id="clockOutBtn" class="secondary" disabled>Clock Out</button>
          <button id="saveProfileBtn" class="primary">Save Profile</button>
          <button id="logoutBtn" class="secondary">Logout</button>
        </div>
      </div>
    </div>

    <footer>
      <p class="footer">&copy; 2025 Company name. All rights reserved</p>
    </footer>

    <script src="js/index.js"></script>
  </body>
</html>
